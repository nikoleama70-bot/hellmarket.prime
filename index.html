let typingInterval;
function startTypingAnimation(){
  const fullText = "WELCOME TO HELL MARKET";
  const el = document.getElementById('typedText');
  if(!el) return;
  let i = 0;
  let isDeleting = false;

  clearInterval(typingInterval);
  typingInterval = setInterval(() => {
    if(!isDeleting) {
      el.textContent = fullText.substring(0, i + 1);
      i++;
      if(i === fullText.length) isDeleting = true;
    } else {
      el.textContent = fullText.substring(0, i - 1);
      i--;
      if(i === 0) isDeleting = false;
    }
  }, 120);
}

window.exitIntroToApp = function(){
  clearInterval(typingInterval);
  if(auth && auth.currentUser) {
    dashboard();
  } else {
    authView('register');
  }
}

async function handleRegister(){
  const u = document.getElementById('username').value.trim(),
        e = document.getElementById('email').value.trim(),
        p = document.getElementById('password').value,
        c = document.getElementById('confirm').value;
        
  if(!u || !e || !p || !c) return toast('Please fill all fields');
  if(p !== c) return toast('Passwords do not match');
  if(p.length < 8) return toast('Password must be at least 8 characters long');

  try {
    if(auth) {
      const cred = await auth.createUserWithEmailAndPassword(e, p);
      const uid = cred.user.uid;
      currentUserData = {
        user: { uid: uid, username: u, email: e },
        balance: 0, transactions: [], cards: [],
        profile: { firstName: '', lastName: '', email: e, mobile: '', address: '' }
      };
      await db.collection("users").doc(uid).set(currentUserData);
    } else {
      currentUserData = {

async function handleLogin(){

  try {
    if(auth) {
      const cred = await auth.signInWithEmailAndPassword(e, p);
      const uid = cred.user.uid;
      const docSnap = await db.collection("users").doc(uid).get();

        currentUserData = { user: { uid: uid, username: e.split('@')[0], email: e }, balance: 0, transactions: [], cards: [], profile: {} };

      else currentUserData = { user: { uid: 'local_user', username: e.split('@')[0], email: e }, balance: 250, transactions: [], cards: [], profile: {} };

function startTimer(duration) {
  let timer = duration, minutes, seconds;
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    minutes = parseInt(timer / 60, 10);
    seconds = parseInt(timer % 60, 10);
    minutes = minutes < 10 ? "0" + minutes : minutes;
    seconds = seconds < 10 ? "0" + seconds : seconds;
    const timerEl = document.getElementById('timer');
    if(timerEl) timerEl.textContent = minutes + ":" + seconds;
    if (--timer < 0) clearInterval(countdownTimer);
  }, 1000);
}

window.adminAddBalance = async function(uid){
  const inputEl = document.getElementById(`addAmt_${uid}`);
  const amt = Number(inputEl ? inputEl.value : 0);
  if(!amt || amt <= 0) return toast('Please enter a valid amount!');

  try {
    const userRef = db.collection("users").doc(uid);
    const docSnap = await userRef.get();
    if(docSnap.exists){
      const data = docSnap.data();
      const currentBal = data.balance || 0;
      const newBal = currentBal + amt;
      let txns = data.transactions || [];
      txns.forEach(t => { if(t.type === 'Deposit') t.status = 'Successful'; });

      await userRef.update({ balance: newBal, transactions: txns });
      toast(`Successfully added $${amt} to user balance!`);

try {
  setTimeout(() => {
    if (!appInitialized) {
      loadFallbackOrDashboard(null);
    }
  }, 2000);

  if(auth) {
    auth.onAuthStateChanged((user) => {
      if(checkRoute()) return;
      loadFallbackOrDashboard(user);
    });
  } else {
    loadFallbackOrDashboard(null);
  }
} catch(initErr) {
  loadFallbackOrDashboard(null);
}
</script>
</body>
</html>
